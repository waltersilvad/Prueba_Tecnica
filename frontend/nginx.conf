server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas del cliente (/clientes, /facturas, /estado) se resuelven con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de assets llevan hash en el nombre: se pueden guardar en caché por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
