<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recordatorios de facturas</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello del tema equivocado.
      // La lógica completa está en src/utils/tema.ts (misma clave y mismos valores).
      ;(function () {
        try {
          var preferencia = localStorage.getItem('facturacion.tema') || 'sistema'
          var oscuro =
            preferencia === 'oscuro' ||
            (preferencia === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
